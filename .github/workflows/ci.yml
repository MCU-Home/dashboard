#
# CI for the MCUHome dashboard. Three gates, because this repository
# holds two programs in two languages:
#
#   lint     — scripts/lint: ruff (check + format) over the backend and
#              docker, from the root .venv, plus the frontend's own
#              `pnpm run check` (prettier, eslint, tsc, vitest) — the
#              same command scripts/lint runs locally. REUSE runs
#              separately, over the whole tree, pinned to the same
#              versions the other MCUHome repositories use.
#   test     — scripts/test: pytest over the backend (the /ws vocabulary,
#              the build orchestration, signing and the two sites), plus
#              `pnpm exec vitest run` over the frontend.
#   frontend — the same scripts/lint call as the lint gate above (its
#              frontend half is `pnpm run check`, unchanged from before);
#              kept as its own job so a frontend-only break is reported
#              under its own name. This means the frontend toolchain and
#              vitest now run in more than one job (lint-ruff, test-pytest
#              and check-pnpm all need Node/pnpm, because both scripts
#              cover both halves of the repository unconditionally) — a
#              known duplication traded for two gate scripts that are
#              each complete and identical to what a developer runs
#              locally.
#
# lint-ruff, test-pytest and check-pnpm each create the .venv or
# backend/.venv their script needs (scripts/lint and scripts/test select
# it themselves, never the runner's Python) and set up Node/pnpm the same
# way check-pnpm always did, because every one of the three now calls a
# script that touches both halves of the repository.
#
# The test gate checks out two public siblings, `mcu-home/mcuhome-sdk`
# (the model) and `mcu-home/mcuhome-workbench` (the workbench): the dashboard
# imports the workbench in-process and neither package is published yet,
# so plain checkouts stand in for the sibling paths that
# `backend/requirements-dev.txt` uses in a west workspace. Once the
# packages are published this becomes a plain pip install.
#
# What is deliberately NOT installed is `mcuhome-compiler`. "The
# dashboard never compiles" is enforced by the dependency rather than by
# a missing code path, and leaving the compiler out here is what keeps
# that checkable in the very environment the tests run in — one test
# asserts the resulting refusal.
#
# All actions are pinned to commit SHAs, not tags (see dependabot.yml,
# whose github-actions entry keeps the pins current).

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-ruff:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # scripts/lint's frontend half needs pnpm, the same setup
      # check-pnpm below always used.
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: frontend/package.json

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.13"

      # scripts/lint selects the root .venv itself, so it is created
      # first, the same way a developer creates one locally.
      - name: Create .venv and install lint tools
        run: |
          python -m venv .venv
          .venv/bin/pip install --disable-pip-version-check ruff==0.16.1

      - name: scripts/lint
        run: scripts/lint


  test-pytest:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout mcu-home/mcuhome-sdk
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mcu-home/mcuhome-sdk
          path: .deps/mcuhome-sdk

      - name: Checkout mcu-home/mcuhome-workbench
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mcu-home/mcuhome-workbench
          path: .deps/mcuhome-workbench

      - name: Set up Python
        # ADR 0004 decision 2 sets this repository's floor above the
        # workbench's: it may sit higher and never lower.
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # scripts/test's frontend half needs pnpm, the same setup
      # check-pnpm below always used.
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: frontend/package.json

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.13"

      # scripts/test selects backend/.venv itself — the repository's own
      # second environment, kept separate from the root .venv (README,
      # "Working on this repository") — so it is created first.
      #
      # One namespace, two repositories since the ADR 0024 split. One
      # invocation, so pip resolves the sibling pins against the copies
      # being installed rather than against an index. No extras on the
      # workbench, and no compiler: this reproduces exactly what
      # `requirements-dev.txt` builds locally.
      - name: Create backend/.venv and install
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install --disable-pip-version-check \
            ./.deps/mcuhome-sdk/packaging/model \
            ./.deps/mcuhome-workbench
          backend/.venv/bin/pip install --disable-pip-version-check -e './backend[dev]'

      - name: scripts/test
        run: scripts/test

  check-pnpm:
    name: "Check (pnpm: prettier, eslint, tsc, vitest)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        # The version comes from `packageManager` in
        # frontend/package.json, so it is never stated twice.
        #
        # Not `corepack enable`, which reads the same pin: the corepack
        # bundled with Node at this floor carries npm registry signing
        # keys that have since been rotated, so it dies on "Cannot find
        # matching keyid" before it ever installs anything (observed
        # here on 22.12).
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: frontend/package.json

      - name: Set up Node
        # The floor `package.json` declares, not the newest release: a
        # gate that only ever runs a newer Node lets the declared floor
        # rot without anyone noticing.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.13"

      - name: Set up Python
        # scripts/lint's backend/docker half needs the root .venv.
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Create .venv and install lint tools
        run: |
          python -m venv .venv
          .venv/bin/pip install --disable-pip-version-check ruff==0.16.1

      - name: scripts/lint
        # format:check, lint, typecheck and test — what a commit must
        # pass locally, run the same way here, plus ruff over
        # backend/docker: this is the same scripts/lint the lint-ruff job
        # above calls, kept as its own job so a frontend-only break is
        # reported under this job's name.
        run: scripts/lint

  build-docker:
    name: Build (container images)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Built and thrown away. What this gate is for is the Dockerfile
      # itself: it installs the workbench from git, builds the frontend
      # and asserts that `mcuhome-compiler` did not come along, and none
      # of that is exercised by the three gates above. Publishing happens
      # on a tag (release.yml), never here.
      - name: Build the standalone image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          target: standalone
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the Home Assistant image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          target: homeassistant
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  license-reuse:
    name: License (reuse)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install
        run: python -m pip install --disable-pip-version-check reuse==5.0.2

      - name: reuse lint
        run: reuse lint

  spell-codespell:
    name: Spelling (codespell)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install
        run: python -m pip install --disable-pip-version-check codespell==2.4.3

      # The ignored words are deliberate spellings, not slips: Requestor and
      # PASE are the Matter specification's own, OT is OpenThread, rsource is
      # Kconfig's. Generated documents and patches are skipped because their
      # wording is not ours to correct.
      - name: codespell
        run: codespell --ignore-words-list=requestor,pase,ot,rsource,re-declared,re-declare,re-used,unparseable,pre-empt --skip='./.git,./frontend/node_modules,*.matter,*.zap,pnpm-lock.yaml,*.patch'

  hygiene-prehooks:
    name: Hygiene (pre-commit-hooks)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install
        run: python -m pip install --disable-pip-version-check pre-commit-hooks==5.0.0

      # The fixers rewrite and exit non-zero when they had to; in CI the tree
      # is throwaway, so that is exactly a check. `patches/` is excluded on
      # purpose: a context line in a unified diff is a single space, and
      # stripping it produces a patch that no longer applies.
      - name: Whitespace, final newline and line endings
        run: |
          text=$(git grep -Il '' -- . ':!patches/**' ':!*.patch' ':!*.matter' ':!*.zap')
          trailing-whitespace-fixer $text
          end-of-file-fixer $text
          mixed-line-ending --fix=no $text

      - name: No merge markers
        run: check-merge-conflict $(git grep -Il '' -- .)

      # --unsafe checks the syntax and not the tags: this project has its own
      # (`!secret`, `!file`), and a loader that refuses them is not a finding.
      - name: YAML parses
        run: |
          files=$(git ls-files '*.yml' '*.yaml')
          if [ -n "$files" ]; then check-yaml --unsafe $files; fi

  commits-conventional:
    name: Commits (conventional)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install
        run: python -m pip install --disable-pip-version-check conventional-pre-commit==4.0.0

      # Merge commits carry GitHub's wording, not ours, so they are skipped.
      - name: Every commit message states its kind
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BASE" ]; then
            range="$BASE..$HEAD_SHA"
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..${{ github.sha }}"
          else
            range="HEAD~1..HEAD"
          fi
          status=0
          for sha in $(git log --no-merges --format=%H "$range"); do
            git log -1 --format=%B "$sha" > /tmp/commit-message
            conventional-pre-commit /tmp/commit-message || { echo "  ^ $sha"; status=1; }
          done
          exit $status
