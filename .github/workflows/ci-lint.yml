#
# Lint gate: one job per wrapper in scripts/lint.d/, plus a pre-check
# that every wrapper has a job here. Every wrapper runs the same way —
# from the root .venv, which holds the linters and nothing else.
#
# Those linters are a PEP 735 dependency group ([dependency-groups] dev
# in the root pyproject.toml), not a [project.optional-dependencies]
# extra: a group installs standalone, and this repository declares no
# Python project an extra could hang off.
#
# --group needs pip >= 25.1; each job upgrades pip in its fresh .venv
# before using it.
#
# The two Kotlin linters are the exception: they run through the front
# end's Gradle wrapper, which fetches the Gradle distribution and the
# linter versions pinned in frontend/gradle/libs.versions.toml itself, so
# those jobs need a JDK instead of a Python environment.
#
# All actions are pinned to commit SHAs, not tags.

name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check-gates:
    name: Check gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: scripts/lint check-ci
        run: scripts/lint check-ci

  lint-codespell:
    name: Lint (codespell)
    needs: check-gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Create .venv and install the dev tools
        run: |
          python -m venv .venv
          .venv/bin/pip install --disable-pip-version-check -U pip
          .venv/bin/pip install --disable-pip-version-check --group dev

      - name: scripts/lint codespell
        run: scripts/lint codespell

  lint-reuse:
    name: Lint (reuse)
    needs: check-gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Create .venv and install the dev tools
        run: |
          python -m venv .venv
          .venv/bin/pip install --disable-pip-version-check -U pip
          .venv/bin/pip install --disable-pip-version-check --group dev

      - name: scripts/lint reuse
        run: scripts/lint reuse

  lint-hygiene:
    name: Lint (hygiene)
    needs: check-gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Create .venv and install the dev tools
        run: |
          python -m venv .venv
          .venv/bin/pip install --disable-pip-version-check -U pip
          .venv/bin/pip install --disable-pip-version-check --group dev

      - name: scripts/lint hygiene
        run: scripts/lint hygiene

  lint-ktlint:
    name: Lint (ktlint)
    needs: check-gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          build-root-directory: frontend
          # Dependency-graph submission writes to the repository's
          # dependency graph; this workflow only reads.
          dependency-graph: disabled

      - name: scripts/lint ktlint
        run: scripts/lint ktlint

  lint-detekt:
    name: Lint (detekt)
    needs: check-gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          build-root-directory: frontend
          # Dependency-graph submission writes to the repository's
          # dependency graph; this workflow only reads.
          dependency-graph: disabled

      - name: scripts/lint detekt
        run: scripts/lint detekt
