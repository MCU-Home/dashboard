#
# Build settings tuned for a development machine with a few gigabytes to
# spare: the Gradle and Kotlin daemons are capped, and at most two worker
# processes run at a time. The Kotlin/Wasm compiler and the Gradle daemon
# together are the memory-heavy part; raise these only on a machine that
# has the memory to give.
#
# The Kotlin daemon's 3 GB is the smallest figure that links the
# production WebAssembly executable of the browser application: at 1 GB
# the compiler stops with "Not enough memory to run compilation" once the
# application carries the device screen. It is a limit of the link step,
# not of everyday compilation.

org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=true

kotlin.daemon.jvmargs=-Xmx3g
kotlin.code.style=official
