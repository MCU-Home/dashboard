#
# Test gate: one job per wrapper in scripts/test.d/, plus a pre-check
# that every wrapper has a job here. There are no wrappers yet — the
# repository holds no code to test — so the pre-check is the whole gate
# for now, and it fails the moment a wrapper is added without its job.
#
# All actions are pinned to commit SHAs, not tags.

name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check-gates:
    name: Check gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: scripts/test check-ci
        run: scripts/test check-ci
