#
# Publish the dashboard's two container images.
#
#   ghcr.io/mcu-home/ui                 `docker run`
#   ghcr.io/mcu-home/ui-homeassistant-app   the Home Assistant App
#
# Triggered by a `v*` tag, and the tag is the version: `v0.1.0` publishes
# `:0.1.0`. Home Assistant pulls the App image by the tag named in the app
# repository's config.yaml, so a release is finished by bumping `version:`
# there — see mcu-home/homeassistant-apps. Doing it the other way round
# offers users an update that cannot be pulled.
#
# One image name per deployment, multi-architecture underneath: amd64 and
# aarch64, the two architectures Home Assistant ships for. The dashboard
# carries no toolchain, so nothing here is gated on the evidence an
# aarch64 *build server* still owes — every dependency is a wheel.
#
# All actions are pinned to commit SHAs, not tags (see dependabot.yml).

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (for example 0.1.0)"
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine the version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${version}"

      - name: Set up QEMU
        # The runner is amd64; the aarch64 leg is emulated. Only the pip
        # install runs that way — the frontend stage is pinned to the
        # build platform, because its output is the same bytes either
        # way.
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Sign in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the standalone image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          target: standalone
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/mcu-home/ui:${{ steps.version.outputs.version }}
            ghcr.io/mcu-home/ui:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish the Home Assistant image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          target: homeassistant
          platforms: linux/amd64,linux/arm64
          push: true
          # No `latest` here on purpose: the Supervisor pulls the exact
          # tag the app's config.yaml names, and a moving tag beside it
          # is only ever something to pull by mistake.
          tags: ghcr.io/mcu-home/ui-homeassistant-app:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
