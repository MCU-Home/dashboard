version = 1
SPDX-PackageName = "mcuhome-ui"
SPDX-PackageSupplier = "The MCUHome Contributors"
SPDX-PackageDownloadLocation = "https://github.com/mcu-home/mcuhome-ui"

# Fallback annotation: files carrying their own SPDX headers take
# precedence ("closest"); everything else (Markdown, templates) is
# covered here.
[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 The MCUHome Contributors"
SPDX-License-Identifier = "Apache-2.0"

# The Gradle wrapper, generated by Gradle and checked in as it comes.
# The two launcher scripts carry their own headers; the jar and the
# properties file have nowhere to put one.
[[annotations]]
path = [
  "frontend/gradle/wrapper/gradle-wrapper.jar",
  "frontend/gradle/wrapper/gradle-wrapper.properties",
]
precedence = "override"
SPDX-FileCopyrightText = "Gradle Inc."
SPDX-License-Identifier = "Apache-2.0"
