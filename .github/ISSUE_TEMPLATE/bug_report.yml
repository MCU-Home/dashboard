name: Bug report
description: Report a defect in the MCUHome Dashboard
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Firmware and device problems belong in the
        [SDK repo](https://github.com/mcu-home/mcuhome-sdk/issues), YAML
        config and build-pipeline problems in the
        [workbench repo](https://github.com/mcu-home/mcuhome/issues) —
        this tracker is for the web interface only.
  - type: input
    id: version
    attributes:
      label: Dashboard version
      placeholder: e.g. 0.1.0.dev0 / git commit hash
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation method
      options:
        - Home Assistant add-on
        - Docker
        - Standalone (pip / source)
        - Other
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: e.g. Firefox 142 on Linux
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Backend logs and/or browser console output.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I removed all secrets (credentials, keys, setup codes) from logs and screenshots.
          required: true
