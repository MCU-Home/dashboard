#
# TOOL CONFIGURATION ONLY — this repository declares no Python project,
# so there is nothing here to build or install. The file exists for the
# repository-wide linters that run from the root .venv: codespell's
# settings (it looks for them in the current directory, and the wrappers
# in scripts/lint.d/ run from there) and the PEP 735 dependency group
# that installs those linters and nothing else.

[dependency-groups]
dev = [
  "codespell==2.4.3",
  "reuse==6.2.0",
  "pre-commit-hooks==6.0.0",
]

# The ignored words are deliberate spellings, not slips: Requestor and
# PASE are the Matter specification's own, OT is OpenThread, rsource is
# Kconfig's. Held here rather than on the CI command line so
# scripts/lint.d/codespell can run the plain tool.
[tool.codespell]
ignore-words-list = "requestor,pase,ot,rsource,re-declared,re-declare,re-used,unparseable,pre-empt"
skip = "./.git"
