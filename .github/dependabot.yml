#
# The github-actions entry is added together with the first CI workflow —
# dependabot errors on directories without manifest files. Pin all
# actions to full commit SHAs when that happens.

version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    groups:
      python-deps:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend-deps:
        patterns: ["*"]
