#
# Container build check for the dashboard. Built and thrown away — what
# this gate is for is the Dockerfile itself: it installs the workbench
# from git, builds the frontend and asserts that mcuhome-compiler did
# not come along, and none of that is exercised by the lint/test gates.
# Publishing happens on a tag (release.yml), never here.
#
# All actions are pinned to commit SHAs, not tags.

name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-docker:
    name: Build (container images)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build the standalone image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          target: standalone
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the Home Assistant image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          target: homeassistant
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
