#
# The single place where dependency versions are pinned. Kotlin, the
# Compose compiler plugin and Compose Multiplatform move together — the
# compiler plugin version always equals the Kotlin version, and the
# Compose Multiplatform release states the Kotlin versions it supports.

[versions]
kotlin = "2.4.10"
compose = "1.12.0"
# Material 3 is versioned separately from the rest of Compose
# Multiplatform; this is the release that ships with Compose 1.12.0.
compose-material3 = "1.12.0-alpha03"
coroutines = "1.11.0"
serialization = "1.11.0"
navigation = "2.9.2"
# The QR encoder behind the Matter pairing dialog. Multiplatform, MIT,
# published for wasmJs; the version below is its newest stable release.
qrose = "1.1.2"
# The linters. The ktlint Gradle plugin and the ktlint engine it runs are
# versioned separately: the plugin ships a default engine version, and
# this pins the engine explicitly so an updated plugin cannot change the
# rules underneath us.
ktlintPlugin = "14.2.0"
ktlint = "1.8.0"
detekt = "1.23.8"

[libraries]
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-material3" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
navigation-compose = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "navigation" }
qrose = { module = "io.github.alexzhirkevich:qrose", version.ref = "qrose" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintPlugin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
