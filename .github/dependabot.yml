#
# The npm ecosystem entry is added together with the frontend framework
# decision (docs/adr/0002), and the github-actions entry together with the
# first CI workflow — dependabot errors on directories without manifest
# files. Pin all actions to full commit SHAs when that happens.

version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    groups:
      python-deps:
        patterns: ["*"]
